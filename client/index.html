<head>
    <link href="client/style.css" rel="stylesheet">
</head>
<div id="signDiv">
    Username: <input id="signDiv-username" type="text"></input><br>
    Password: <input id="signDiv-password" type="password"></input>
    <button id="signDiv-signIn">Sign In</button>
    <button id="signDiv-signUp">Sign Up</button>
</div>
<div id="gameDiv" style="display:none;">
    <div id="game" style="position:absolute;width:500px;height:500px">
        <canvas id="ctx" width="500" height="500" style="position:absolute;border:0px solid #000000;"></canvas>
        

        <div id="ui">
            <button id="changeMapButton" style="position:absolute;bottom:0px;left:0px">
                Change Map
            </button>
        </div>
    </div>

    <div id="belowGame" style="margin-top:120px">
        <div id="chat-text" style="position:absolute;width:500px;height:100px;bottom:20px;left:15px;overflow-y:scroll">
            <div> Hello! Basin Invasion Beta 0.02</div>
        </div>
        <div id="inventory" style="position:absolute;z-index: index 1;"></div>
        <form id="chat-form">
            <input id="chat-input" type="text" style="position:absolute;width:500px;height:20px;bottom:0px;left:10px;border:2px solid darkgray"></input> 
        </form>
        <div id = "chat-border" style="position:absolute;width:10px;height:120px;background-color:gray;border:2px solid darkgray;bottom:0px;left:0px;"></div>
    </div>


<script src='
https://cdn.socket.io/4.8.1/socket.io.min.js'></script>
<script type="module" src="/client/js/game.js">
</script>   

<button onclick="happy()">happy</button>
